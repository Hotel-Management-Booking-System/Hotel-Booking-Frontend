<div class="page-container">

  <h1>Explore Hotels</h1>

  <!-- Search -->
  <input [(ngModel)]="searchCity" placeholder="Search city..." />
  <button (click)="searchHotels()">Search</button>
  <button (click)="loadHotels()">Clear</button>

  <!-- Loading -->
  <p *ngIf="isLoading">Loading...</p>

  <!-- Error -->
  <p *ngIf="errorMessage">{{ errorMessage }}</p>

  <!-- Hotels -->
  <div *ngFor="let hotel of hotels" class="hotel-card">

    <img [src]="hotel.imageUrl || 'assets/hotel-placeholder.jpg'"
      (error)="hotel.imageUrl='assets/hotel-placeholder.jpg'" width="200" />

    <h3>{{ hotel.name }}</h3>

    <p>📍 {{ hotel.city }}, {{ hotel.country }}</p>

    <!-- Safe fields -->
    <p *ngIf="hotel.description">{{ hotel.description }}</p>

    <p *ngIf="hotel.location">📌 {{ hotel.location }}</p>

    <!-- Amenities -->
    <div *ngIf="hotel.amenities?.length">
      <strong>Amenities:</strong>
      <span *ngFor="let a of hotel.amenities"> {{ a }} </span>
    </div>

    <button (click)="viewRooms(hotel.id)">View Rooms</button>

  </div>

</div>
