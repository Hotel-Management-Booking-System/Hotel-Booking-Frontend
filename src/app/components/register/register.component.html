<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <span class="auth-icon">🏨</span>
      <h2>Create Account</h2>
      <p>Join StayEase and start exploring</p>
    </div>

    <div class="alert alert-success" *ngIf="successMessage">{{ successMessage }}</div>
    <div class="alert alert-error" *ngIf="errorMessage">{{ errorMessage }}</div>

    <form #registerForm="ngForm" (ngSubmit)="onRegister()">

      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="fullName" [(ngModel)]="registerData.fullName" placeholder="John"
          required />
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" [(ngModel)]="registerData.email" placeholder="you@example.com"
          required />
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" [(ngModel)]="registerData.phone" placeholder="+1 234 567 8900"
          required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" [(ngModel)]="registerData.password"
          placeholder="Min 6 characters" required />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" [(ngModel)]="confirmPassword"
          placeholder="Repeat password" required />
      </div>

      <button type="submit" class="btn btn-primary btn-full" [disabled]="isLoading">
        <span *ngIf="!isLoading">Create Account</span>
        <span *ngIf="isLoading">Registering...</span>
      </button>
    </form>

    <div class="auth-footer">
      <p>Already have an account? <a routerLink="/login">Login here</a></p>
    </div>
  </div>
</div>
